name: kuru_mobile
description: "TuiBuonBan — mobile companion app for the kuru retail platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # pinned to match what flutter_localizations vendors

  # State + DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Feedback (toasts + snackbars wrapper — see lib/core/feedback/k_notify.dart)
  toastification: ^3.2.0

  # UUID generation — for idempotency keys in order operations
  uuid: ^4.5.1

  # Auth
  # NOTE: pub.dev's latest (0.6.3) caps SDK at <3.9.0 — incompatible with our
  # Dart 3.11.5. The maintainer's master branch (0.6.5) has the corrected
  # constraint `>=2.12.0 <4.0.0`. Switch back to a pub.dev pin once 0.6.5+ ships.
  supertokens_flutter:
    git:
      url: https://github.com/supertokens/supertokens-flutter.git
      ref: master

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  shared_preferences: ^2.3.4

  # Logging
  logger: ^2.5.0

  # Version label on splash + future "about" / debug-info screens
  package_info_plus: ^8.1.2

  # Icons — port of Tabler icon set, matches kuru-web's @tabler/icons-react
  flutter_tabler_icons: ^1.43.0

  # Lazy masonry grid for large product catalogs.
  flutter_staggered_grid_view: ^0.7.0

  # Native iOS/Android context menus — paired with KPopupMenu, sits
  # alongside KActionSheet for bottom-sheet-vs-popup choice per use case.
  # TEMPORARILY REMOVED 2026-05-18 — its Rust binding is the prime suspect
  # for the splash-crash on iOS 26 devices (built for iOS 17.5 but linked
  # at 14.0 per build warnings). KPopupMenu stubbed in k_popup_menu.dart.
  # Restore once we have an iOS 26 build OR rule it out via crash log.
  # super_context_menu: ^0.9.1

  # Required by dart-dio generated clients (Categories v0.4.0+)
  built_value: ^8.9.2
  built_collection: ^5.1.1
  kuru_category_api:
    path: lib/api/category
  kuru_brand_api:
    path: lib/api/brand
  kuru_product_api:
    path: lib/api/product
  mobile_scanner: ^7.2.0
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

  # Build-time asset generators — no app-bundle impact, no native code.
  # Run with `dart run flutter_launcher_icons` / `flutter_native_splash:create`
  # after changing the configs below.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.6
  openapi_generator_cli: ^6.1.0
  built_value_generator: ^8.10.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true     # turns on flutter_localizations codegen
  assets:
    - assets/
    - assets/lottie/

# App icon generation — produces iOS AppIcon set + Android mipmaps + adaptive
# icon. Source: assets/logo.webp (1280x1280). Re-run when the source changes:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.webp"
  ios: true
  android: true
  remove_alpha_ios: true
  adaptive_icon_background: "#080814"
  adaptive_icon_foreground: "assets/logo.webp"

# Native launch screen — replaces the white-flash default. Background matches
# the auth pageBg tone (indigo light/dark). Re-run when configs change:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F3F6FF"
  color_dark: "#080814"
  image: "assets/logo_splash.png"
  image_dark: "assets/logo_splash.png"
  android_12:
    color: "#F3F6FF"
    color_dark: "#080814"
    image: "assets/logo_splash.png"
    image_dark: "assets/logo_splash.png"
  ios: true
  android: true
  fullscreen: false
