name: kuru_mobile
description: "Kuru — mobile companion app for the kuru retail platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # pinned to match what flutter_localizations vendors

  # State + DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Feedback (toasts + snackbars wrapper — see lib/core/feedback/k_notify.dart)
  toastification: ^3.2.0

  # Auth
  # NOTE: pub.dev's latest (0.6.3) caps SDK at <3.9.0 — incompatible with our
  # Dart 3.11.5. The maintainer's master branch (0.6.5) has the corrected
  # constraint `>=2.12.0 <4.0.0`. Switch back to a pub.dev pin once 0.6.5+ ships.
  supertokens_flutter:
    git:
      url: https://github.com/supertokens/supertokens-flutter.git
      ref: master

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.4

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  generate: true     # turns on flutter_localizations codegen
  assets:
    - assets/
