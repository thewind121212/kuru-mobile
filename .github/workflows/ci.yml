name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Pull packages
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run build_runner (freezed / json_serializable)
        # `--delete-conflicting-outputs` is required because we already commit
        # the generated files; CI regenerates to verify they're in sync.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files match what's committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run \`dart run build_runner build --delete-conflicting-outputs\` locally and commit the result."
            git status
            git diff
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Test
        run: flutter test --reporter=expanded

  build-android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Pull packages
        run: flutter pub get

      - name: Build APK (debug, no signing)
        # Smoke build — confirms the project compiles end-to-end with the
        # Gradle / AGP / Kotlin versions the project pins. Not uploaded.
        run: flutter build apk --debug --no-tree-shake-icons

  build-ios:
    name: iOS debug build (no-codesign)
    runs-on: macos-14
    needs: analyze-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Pull packages
        run: flutter pub get

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (no codesign)
        # `--no-codesign` skips signing identities + provisioning profiles.
        # Mirrors `flutter build ios --simulator` in spirit: validates the
        # native iOS link works without needing Apple Developer credentials
        # in CI.
        run: flutter build ios --debug --no-codesign --simulator
